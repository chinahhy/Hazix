name: Release APKs

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v prefix, for example 3.4.0"
        required: true
        type: string
      publish:
        description: "Publish a GitHub Release after the signed build succeeds"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-apks-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_SIGNER_SHA256: 6f4c4390f681e237d466ab0d4bfb7f43305f8c24d169d4a4320d2a041f3fd9f1

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Detect an already published tag release
        id: existing-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]] && gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            echo "Release ${GITHUB_REF_NAME} is already published; no cloud rebuild is needed."
          else
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Set up Java 17
        if: steps.existing-release.outputs.skip != 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        if: steps.existing-release.outputs.skip != 'true'
        uses: gradle/actions/setup-gradle@v6

      - name: Resolve version
        if: steps.existing-release.outputs.skip != 'true'
        id: version
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${MANUAL_VERSION}"
          fi

          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must use MAJOR.MINOR.PATCH, for example 3.3.8"
            exit 1
          fi

          IFS=. read -r MAJOR MINOR PATCH <<< "${VERSION}"
          VERSION_CODE=$((10#${MAJOR} * 1000000 + 10#${MINOR} * 1000 + 10#${PATCH}))

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "version_code=${VERSION_CODE}" >> "${GITHUB_OUTPUT}"

      - name: Restore APK signing key
        if: steps.existing-release.outputs.skip != 'true'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          HAZIX_RELEASE_KEYSTORE: ${{ runner.temp }}/hazix-release.keystore
        run: |
          if [[ -z "${KEYSTORE_BASE64}" ]]; then
            echo "::error::ANDROID_DEBUG_KEYSTORE_BASE64 is not configured"
            exit 1
          fi

          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${HAZIX_RELEASE_KEYSTORE}"
          chmod 600 "${HAZIX_RELEASE_KEYSTORE}"

          KEYSTORE_SIGNER_SHA256=$(
            keytool -exportcert \
              -keystore "${HAZIX_RELEASE_KEYSTORE}" \
              -storepass android \
              -alias androiddebugkey |
              sha256sum |
              awk '{print $1}'
          )
          if [[ "${KEYSTORE_SIGNER_SHA256}" != "${EXPECTED_SIGNER_SHA256}" ]]; then
            echo "::error::Configured signing key does not match the installed-app upgrade chain"
            exit 1
          fi

      - name: Lint and build release APKs
        if: steps.existing-release.outputs.skip != 'true'
        shell: bash
        env:
          HAZIX_RELEASE_KEYSTORE: ${{ runner.temp }}/hazix-release.keystore
        run: >-
          ./gradlew
          :nativeapp:testDebugUnitTest
          :nativeapp:lintRelease
          :nativeapp:assembleRelease
          :mobileapp:lintRelease
          :mobileapp:assembleRelease
          --no-daemon
          -PVERSION_NAME=${{ steps.version.outputs.version }}
          -PVERSION_CODE=${{ steps.version.outputs.version_code }}
          -PhazixMirrorBase=${{ vars.NAS_MIRROR_BASE }}

      - name: Verify and stage release files
        if: steps.existing-release.outputs.skip != 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          HAZIX_RELEASE_KEYSTORE: ${{ runner.temp }}/hazix-release.keystore
        run: |
          mkdir -p release
          cp nativeapp/build/outputs/apk/release/nativeapp-release.apk "release/Hazix-TV-v${VERSION}.apk"
          cp mobileapp/build/outputs/apk/release/mobileapp-release.apk "release/Hazix-Mobile-v${VERSION}.apk"

          # Both apps must be signed by the same key as the installed builds,
          # otherwise the TV in-app updater and phone upgrades both fail.
          for APK in "release/Hazix-TV-v${VERSION}.apk" "release/Hazix-Mobile-v${VERSION}.apk"; do
            "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose "${APK}"
            APK_SIGNER_SHA256=$(
              "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --print-certs "${APK}" |
                awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print $2}'
            )
            if [[ "${APK_SIGNER_SHA256}" != "${EXPECTED_SIGNER_SHA256}" ]]; then
              echo "::error::${APK} signer does not match the installed-app upgrade chain"
              exit 1
            fi
          done

          cd release
          sha256sum "Hazix-TV-v${VERSION}.apk" "Hazix-Mobile-v${VERSION}.apk" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload workflow artifact
        if: steps.existing-release.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Hazix-v${{ steps.version.outputs.version }}
          path: release/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: >-
          steps.existing-release.outputs.skip != 'true' &&
          (github.event_name != 'workflow_dispatch' || inputs.publish)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v${VERSION}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "::error::Release ${TAG} already exists; use a new version"
            exit 1
          fi

          # Prefer the curated CHANGELOG.md section for this version over the
          # sparse notes GitHub generates from the commit range.
          awk -v v="## ${VERSION}" 'index($0, v) == 1 { capture = 1; next } capture && /^## / { exit } capture { print }' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            printf 'See CHANGELOG.md for the changes in this release.\n' > release-notes.md
          fi
          printf '\nFull history: https://github.com/%s/blob/%s/CHANGELOG.md\n' \
            "${GITHUB_REPOSITORY}" "${TAG}" >> release-notes.md

          gh release create "${TAG}" \
            release/Hazix-TV-v${VERSION}.apk \
            release/Hazix-Mobile-v${VERSION}.apk \
            release/SHA256SUMS.txt \
            --target "${GITHUB_SHA}" \
            --title "Hazix ${TAG}" \
            --notes-file release-notes.md

      # Optional: pull the fresh release into the household's NAS mirror so the
      # TV downloads it over the LAN instead of from GitHub. Configure the
      # repository variable NAS_MIRROR_BASE (for example http://192.168.1.10:8088)
      # to enable it. This never blocks a release: the mirror is a convenience,
      # GitHub stays the source of truth (the client verifies SHA-256 either way).
      - name: Warm the NAS mirror
        if: ${{ vars.NAS_MIRROR_BASE != '' }}
        continue-on-error: true
        env:
          MIRROR: ${{ vars.NAS_MIRROR_BASE }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -x
          curl -fsS --max-time 120 -o /dev/null \
            "${MIRROR}/chinahhy/Hazix/releases/download/v${VERSION}/Hazix-TV-v${VERSION}.apk" || true
          curl -fsS --max-time 120 -o /dev/null \
            "${MIRROR}/chinahhy/Hazix/releases/download/v${VERSION}/Hazix-Mobile-v${VERSION}.apk" || true
          curl -fsS --max-time 120 -o /dev/null \
            "${MIRROR}/chinahhy/Hazix/releases/download/v${VERSION}/SHA256SUMS.txt" || true
