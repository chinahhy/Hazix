name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check JavaScript
        run: pnpm run check
      - name: Run web tests
        run: pnpm test

  android:
    name: Android tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Test and lint TV and mobile apps
        run: >-
          ./gradlew
          :nativeapp:testDebugUnitTest
          :mobileapp:testDebugUnitTest
          :nativeapp:lintDebug
          :mobileapp:lintDebug
          --no-daemon
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            nativeapp/build/reports/
            mobileapp/build/reports/
          if-no-files-found: ignore
          retention-days: 7

  release-apks:
    name: Build TV and mobile APKs
    # Secrets are not available to pull requests opened from forks.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Restore APK signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          HAZIX_RELEASE_KEYSTORE: ${{ runner.temp }}/hazix-release.keystore
        run: |
          if [[ -z "${KEYSTORE_BASE64}" ]]; then
            echo "::error::ANDROID_DEBUG_KEYSTORE_BASE64 is not configured"
            exit 1
          fi
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${HAZIX_RELEASE_KEYSTORE}"
          chmod 600 "${HAZIX_RELEASE_KEYSTORE}"
      - name: Build TV and mobile release APKs
        shell: bash
        env:
          HAZIX_RELEASE_KEYSTORE: ${{ runner.temp }}/hazix-release.keystore
        run: >-
          ./gradlew
          :nativeapp:assembleRelease
          :mobileapp:assembleRelease
          --no-daemon
      - name: Verify signer and stage APKs
        shell: bash
        env:
          EXPECTED_SIGNER_SHA256: 6f4c4390f681e237d466ab0d4bfb7f43305f8c24d169d4a4320d2a041f3fd9f1
        run: |
          mkdir -p ci-apks
          cp nativeapp/build/outputs/apk/release/nativeapp-release.apk "ci-apks/Hazix-TV-${GITHUB_SHA::7}.apk"
          cp mobileapp/build/outputs/apk/release/mobileapp-release.apk "ci-apks/Hazix-Mobile-${GITHUB_SHA::7}.apk"

          for APK in ci-apks/*.apk; do
            SIGNER=$(
              "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --print-certs "${APK}" |
                awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print $2}'
            )
            echo "${APK} signer: ${SIGNER}"
            if [[ "${SIGNER}" != "${EXPECTED_SIGNER_SHA256}" ]]; then
              echo "::error::${APK} is not signed with the release key"
              exit 1
            fi
          done
          sha256sum ci-apks/*.apk
      - name: Upload installable APKs
        uses: actions/upload-artifact@v4
        with:
          name: Hazix-APKs-${{ github.sha }}
          path: ci-apks/
          if-no-files-found: error
          retention-days: 14
