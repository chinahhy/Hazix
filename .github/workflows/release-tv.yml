name: Release TV APK

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v prefix, for example 3.3.8"
        required: true
        type: string
      publish:
        description: "Publish a GitHub Release after the signed build succeeds"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-tv-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Detect an already published tag release
        id: existing-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]] && gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            echo "Release ${GITHUB_REF_NAME} is already published; no cloud rebuild is needed."
          else
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Set up Java 17
        if: steps.existing-release.outputs.skip != 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        if: steps.existing-release.outputs.skip != 'true'
        uses: gradle/actions/setup-gradle@v6

      - name: Resolve version
        if: steps.existing-release.outputs.skip != 'true'
        id: version
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${MANUAL_VERSION}"
          fi

          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must use MAJOR.MINOR.PATCH, for example 3.3.8"
            exit 1
          fi

          IFS=. read -r MAJOR MINOR PATCH <<< "${VERSION}"
          VERSION_CODE=$((10#${MAJOR} * 1000000 + 10#${MINOR} * 1000 + 10#${PATCH}))

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "version_code=${VERSION_CODE}" >> "${GITHUB_OUTPUT}"

      - name: Restore APK signing key
        if: steps.existing-release.outputs.skip != 'true'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "${KEYSTORE_BASE64}" ]]; then
            echo "::error::ANDROID_DEBUG_KEYSTORE_BASE64 is not configured"
            exit 1
          fi

          mkdir -p "${HOME}/.android"
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${HOME}/.android/debug.keystore"
          chmod 600 "${HOME}/.android/debug.keystore"

      - name: Lint and build release APK
        if: steps.existing-release.outputs.skip != 'true'
        shell: bash
        run: >-
          ./gradlew
          :nativeapp:lintRelease
          :nativeapp:assembleRelease
          --no-daemon
          -PVERSION_NAME=${{ steps.version.outputs.version }}
          -PVERSION_CODE=${{ steps.version.outputs.version_code }}

      - name: Verify and stage release files
        if: steps.existing-release.outputs.skip != 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release
          cp nativeapp/build/outputs/apk/release/nativeapp-release.apk "release/Hazix-TV-v${VERSION}.apk"
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose "release/Hazix-TV-v${VERSION}.apk"
          cd release
          sha256sum "Hazix-TV-v${VERSION}.apk" > SHA256SUMS.txt

      - name: Upload workflow artifact
        if: steps.existing-release.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Hazix-TV-v${{ steps.version.outputs.version }}
          path: release/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: >-
          steps.existing-release.outputs.skip != 'true' &&
          (github.event_name != 'workflow_dispatch' || inputs.publish)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v${VERSION}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "::error::Release ${TAG} already exists; use a new version"
            exit 1
          fi

          gh release create "${TAG}" \
            release/Hazix-TV-v${VERSION}.apk \
            release/SHA256SUMS.txt \
            --target "${GITHUB_SHA}" \
            --title "Hazix TV ${TAG}" \
            --generate-notes
